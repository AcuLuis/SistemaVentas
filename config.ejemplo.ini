; Copia este archivo como config.ini y coloca tus datos de conexión a MySQL.
; config.ini está en .gitignore: tus credenciales no se suben al repositorio.
[mysql]
host = 127.0.0.1
port = 3306
user = tu_usuario
password = tu_contraseña
database = bd_tienda_tecnologia

[sistema]
; Minutos sin usar el sistema antes de bloquear la pantalla (pide la contraseña para seguir).
; 0 desactiva el bloqueo. Si no pones esta sección, se usan 10 minutos.
bloqueo_minutos = 10
